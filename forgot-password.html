<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>بازیابی رمز عبور</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/css/fonts.css?v=1.0.3">
  <link rel="stylesheet" href="assets/css/auth.css?v=1.0.3">
  <script src="assets/vendor/vue.global.prod.js?v=1.0.3"></script>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div id="app">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <svg width="27" height="27" fill="none" stroke="currentColor" viewBox="0 0 24 24"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L21 2M17 6l3 3M14 9l3 3"/>
          </svg>
        </div>
        <h1 class="auth-title">بازیابی رمز عبور</h1>
        <p class="auth-subtitle">
          ایمیل حساب خود را وارد کنید تا لینک تعیین رمز جدید برایتان ارسال شود
        </p>
      </div>

      <!-- پیام ارسال موفق -->
      <template v-if="isSent">
        <div class="message message-success">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          <span>{{ successMessage }}</span>
        </div>

        <div class="message message-info">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>
          </svg>
          <span>
            لینک ارسال‌شده تا یک ساعت اعتبار دارد. اگر ایمیلی دریافت نکردید،
            پوشه هرزنامه را بررسی کنید.
          </span>
        </div>

        <a href="login.html" class="submit-btn" style="display:block;text-align:center;text-decoration:none">
          <span class="btn-content">بازگشت به صفحه ورود</span>
        </a>

        <div class="card-footer">
          ایمیل را دریافت نکردید؟
          <a href="#" class="link" @click.prevent="isSent = false">تلاش دوباره</a>
        </div>
      </template>

      <template v-else>
        <div v-if="error" class="message message-error">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>
          </svg>
          <span>{{ error }}</span>
        </div>

        <form @submit.prevent="submit" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">ایمیل حساب کاربری</label>
            <div class="input-wrapper">
              <input id="email" v-model.trim="email" type="email"
                     class="form-input ltr" :class="{ 'has-error': fieldError }"
                     placeholder="you@example.com"
                     autocomplete="email" :disabled="isLoading" autofocus>
              <span class="input-icon">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
              </span>
            </div>
            <div class="field-error" v-if="fieldError">{{ fieldError }}</div>
          </div>

          <button type="submit" class="submit-btn" :disabled="isLoading">
            <span class="btn-content">
              <template v-if="isLoading">
                <span class="spinner"></span><span>در حال ارسال…</span>
              </template>
              <template v-else>
                <span>ارسال لینک بازیابی</span>
                <svg width="19" height="19" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 12H5M11 19l-7-7 7-7"/>
                </svg>
              </template>
            </span>
          </button>
        </form>

        <div class="center">
          <a href="login.html" class="back-link">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            بازگشت به صفحه ورود
          </a>
        </div>
      </template>
    </div>
  </div>

  <script type="module">
    import { createAuthApp, apiPost, isValidEmail } from './assets/js/auth.js';

    const { ref } = Vue;

    createAuthApp({
      setup() {
        const email = ref('');
        const fieldError = ref('');
        const error = ref('');
        const isLoading = ref(false);
        const isSent = ref(false);
        const successMessage = ref('');

        const submit = async () => {
          error.value = '';
          fieldError.value = '';

          if (!isValidEmail(email.value)) {
            fieldError.value = 'ایمیل معتبر وارد کنید';
            return;
          }

          isLoading.value = true;

          try {
            const data = await apiPost('auth/forgot-password.php', { email: email.value });

            // پاسخ سرور عمداً مبهم است تا وجود یا نبود ایمیل افشا نشود
            successMessage.value = data.message
              || 'اگر این ایمیل در سیستم ثبت شده باشد، لینک بازیابی برای شما ارسال می‌شود.';
            isSent.value = true;
          } catch (e) {
            error.value = e.message;
          } finally {
            isLoading.value = false;
          }
        };

        return { email, fieldError, error, isLoading, isSent, successMessage, submit };
      },
    });
  </script>
</body>
</html>
